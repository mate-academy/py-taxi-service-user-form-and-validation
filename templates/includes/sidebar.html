<ul class="sidebar-nav list-group">
  {% if user.is_authenticated %}
    <li class="list-group-item user-info">
      <div class="d-flex align-items-center">
        <div class="avatar">{{ user.username|slice:":1"|upper }}</div>
        <div class="ml-2">
          <div class="user-name">{{ user.username }}</div>
          <a class="small text-muted" href="{{ user.get_absolute_url }}">Profile</a>
        </div>
      </div>
    </li>
    <li class="list-group-item">
      <a class="nav-link" href="{% url 'logout'%}?next={{request.path}}">
        🚪 Logout
      </a>
    </li>
  {% else %}
    <li class="list-group-item">
      <a class="nav-link" href="{% url 'login'%}?next={{request.path}}">
        🔑 Login
      </a>
    </li>
  {% endif %}

  <div class="nav-section mt-3 mb-1">Navigation</div>

  <li class="list-group-item {% if request.resolver_match.url_name == 'index' %}active{% endif %}">
    <a class="nav-link" href="{% url 'taxi:index' %}">
      🏠 Home
    </a>
  </li>
  <li class="list-group-item {% if request.resolver_match.url_name == 'driver-list' %}active{% endif %}">
    <a class="nav-link" href="{% url 'taxi:driver-list' %}">
      👨‍✈️ All drivers
    </a>
  </li>
  <li class="list-group-item {% if request.resolver_match.url_name == 'car-list' %}active{% endif %}">
    <a class="nav-link" href="{% url 'taxi:car-list' %}">
      🚗 All cars
    </a>
  </li>
  <li class="list-group-item {% if request.resolver_match.url_name == 'manufacturer-list' %}active{% endif %}">
    <a class="nav-link" href="{% url 'taxi:manufacturer-list' %}">
      🏭 All manufacturers
    </a>
  </li>
</ul>
