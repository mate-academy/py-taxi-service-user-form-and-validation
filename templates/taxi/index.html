{% extends "base.html" %}

{% block content %}
  <div class="container mt-5">
    <div class="text-center mb-4">
      <h1 class="display-4 text-primary">🚕 Taxi Service Home</h1>
      <p class="lead">Welcome to <strong>Best Taxi Ever!</strong></p>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4 mb-4">
      <div class="col">
        <div class="card text-white bg-success shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title">🚗 Cars</h5>
            <p class="card-text fs-4">{{ num_cars }}</p>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card text-white bg-info shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title">👨‍✈️ Drivers</h5>
            <p class="card-text fs-4">{{ num_drivers }}</p>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card text-white bg-warning shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title">🏭 Manufacturers</h5>
            <p class="card-text fs-4">{{ num_manufacturers }}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="alert alert-secondary text-center">
      You have visited this page {{ num_visits }} time{{ num_visits|pluralize }}.
    </div>
  </div>
{% endblock %}
