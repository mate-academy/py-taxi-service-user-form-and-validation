{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Update Driver License</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}

    <input type="submit" value="Update" class="btn btn-success">
    <a href="{% url 'taxi:driver-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
