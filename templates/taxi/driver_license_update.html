{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Update driver license</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <div class="mt-3">
      <input type="submit" value="Update" class="btn btn-primary">
      <a href="{% url 'taxi:driver-detail' pk=object.id %}" class="btn btn-secondary">
        Cancel
      </a>
    </div>
  </form>
{% endblock %}
