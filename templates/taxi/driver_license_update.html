{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Update Driver License</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}

    <input type="submit" value="Update License" class="btn btn-primary">
    <a href="{% url 'taxi:driver-detail' pk=object.pk %}" class="btn btn-link">Cancel</a>
  </form>
{% endblock %}
