{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
  <h1>Update Driver License</h1>
  <form action="" method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Save" class="btn btn-primary">
    {% url 'taxi:driver-list' as driver_list_url %}
    <a href="{{ request.META.HTTP_REFERER|default:driver_list_url }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
