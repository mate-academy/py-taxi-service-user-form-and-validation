{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Update Driver's License</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}

    <input
        type="submit"
        value="Update"
        class="btn btn-primary"
    >
    <button
        type="button"
        onclick="window.history.back()"
        class="btn btn-secondary">
      Cancel
    </button>
  </form>
{% endblock %}
