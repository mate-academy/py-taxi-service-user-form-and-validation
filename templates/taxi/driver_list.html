{% extends "base.html" %}

{% block content %}
<h1>Lista Kierowców</h1>
<ul>
  {% for driver in driver_list %}
    <li>
      <a href="{% url 'driver-detail' driver.pk %}">
        {{ driver.user.username }} ({{ driver.user.first_name }} {{ driver.user.last_name }})
      </a>
    </li>
  {% endfor %}
</ul>
<a href="{% url 'driver-create' %}">
  <button>Dodaj Nowego Kierowcę</button>
</a>

{% endblock %}
