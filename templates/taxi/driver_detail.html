{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h1>{{ user.username }}</h1>

  <p><strong>First name:</strong> {{ user.first_name }}</p>
  <p><strong>Last name:</strong> {{ user.last_name }}</p>
  <p><strong>License number:</strong> {{ user.license_number }}</p>

  <div class="mt-3">
    <a href="{% url 'taxi:driver-update' pk=user.id %}" class="btn btn-primary">
      Update license
    </a>

    <a href="{% url 'taxi:driver-delete' pk=user.id %}" class="btn btn-danger">
      Delete
    </a>
  </div>
</div>
{% endblock %}
