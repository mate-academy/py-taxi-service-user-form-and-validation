{% extends "base.html" %}

{% block content %}
  <h1>{{ driver.username }}'s Profile</h1>
  <p>First Name: {{ driver.first_name }}</p>
  <p>Last Name: {{ driver.last_name }}</p>
  <p>License Number: {{ driver.license_number }}</p>

  {% if user == driver %}
    <a href="{% url 'taxi:driver-license-update' %}" class="btn btn-warning">Update License</a>
  {% endif %}
  
  <a href="{% url 'taxi:driver-delete' pk=driver.pk %}" class="btn btn-danger">Delete Driver</a>

  <a href="{% url 'taxi:driver-list' %}" class="btn btn-secondary">Back to Drivers</a>
{% endblock %}
