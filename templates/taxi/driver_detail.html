{% extends "base.html" %}

{% block content %}
  <h1>
    {{ driver }}
    <a href="{% url 'taxi:driver-delete' pk=driver.id %}" class="btn btn-danger link-to-page">
      Delete
    </a>

    <a href="{% url 'taxi:driver-update' pk=driver.id %}" class="btn btn-secondary link-to-page">
      Update
    </a>
  </h1>
  <h1>Cars</h1>
  <hr>
  <ul>
    {% for car in driver.cars.all %}
      <li>{{ car.model }} </li>
    {% endfor %}
  </ul>
{% endblock %}
