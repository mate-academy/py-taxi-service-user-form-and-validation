{% extends "base.html" %}

{% block content %}
  <h1>{% if object %}Update Driver{% else %}Create Driver{% endif %}</h1>
  <form action="" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
