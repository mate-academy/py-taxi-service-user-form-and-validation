{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>{{ object|yesno:"Update,Create" }} driver {% if object %}license{% endif %}</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}

    <input type="submit" value="Submit" class="btn btn-primary">
    <a href="{% if object %}{% url 'taxi:driver-detail' pk=driver.id %}{% else %}{% url 'taxi:driver-list' %}{% endif %} " class="btn btn-dark">Cancel</a>
  </form>
{% endblock %}
