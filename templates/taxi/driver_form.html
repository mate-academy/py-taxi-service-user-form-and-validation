{% extends "base.html" %}
{% load crispy_forms_filters %}
{% block content %}
  <h1>
    {% if object %}
      Update License Number of {{ object.username }}
    {% else %}
      Create Driver
    {% endif %}
  </h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <input class="btn btn-primary" type="submit" value="Submit">
  </form>
{% endblock %}
