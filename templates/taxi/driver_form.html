{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>
    {% if object %}
      Update license: {{ object.username }}
    {% else %}
      Create driver
    {% endif %}
  </h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" class="btn btn-primary" value="Submit">
  </form>
{% endblock %}
