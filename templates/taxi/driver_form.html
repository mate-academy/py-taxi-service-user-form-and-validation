{% extends "base.html" %}
{% load crispy_forms_filters %}
{% block content %}
  <h1>{{ object|yesno:"Update License number,Create driver" }}</h1>
  <form action="" method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <input class="btn btn-success" type="submit" value="Submit">
    <a class="btn btn-danger" href="{% url "taxi:driver-detail" pk=driver.pk %}">Cancel</a>
  </form>
  <br>
{% endblock %}
