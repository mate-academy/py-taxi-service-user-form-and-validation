{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>{{ object|yesno:"Update license number,Create driver" }}</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}

    <input type="submit" value="Submit" class="btn btn-primary">
    <a href="{{ request.META.HTTP_REFERER|default:'/drivers/' }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
