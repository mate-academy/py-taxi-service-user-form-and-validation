{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>{{ object|yesno:"Update,Create" }} driver {{ object|yesno:'license,' }}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}

    <button class="btn btn-primary" type="submit">Submit</button>
  </form>
{% endblock %}
