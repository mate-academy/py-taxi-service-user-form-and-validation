{% extends "base.html" %}

{% block content %}
  <h1>
    {% if form.instance.pk %}
      Update Driver
    {% else %}
      Create Driver
    {% endif %}
  </h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">
      Save
    </button>
    <a href="javascript:history.back()" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
