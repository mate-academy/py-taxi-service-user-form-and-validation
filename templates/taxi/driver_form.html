{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>{{object|yesno:"Update,Create"}} Driver</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}

    <input type="submit" value="Submit" class="btn btn-primary">
    {% if driver %}
      <a class="btn btn-primary" href="{% url 'taxi:driver-detail' pk=driver.id %}" role="button">Cancel</a>
    {% else %}
      <a class="btn btn-primary" href="{% url 'taxi:driver-list' %}" role="button">Cancel</a>
    {% endif %}
  </form>
{% endblock %}
