{% extends "base.html" %}
{% load crispy_forms_filters %}
{% load crispy_forms_tags %}

{% block content %}
    <h1>{% if object.pk %}Edit driver{% else %}Create a new driver{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary mt-3">Save</button>
    </form>
    <a href="{% url "taxi:driver-list" %}" class="btn btn-secondary mt-3">Cancel</a>
{% endblock content %}
