{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>{% if object %}Редагувати профіль водія{% else %}Додати водія{% endif %}</h1>

  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}

    <button type="submit" class="btn btn-primary">Зберегти</button>
    <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn-secondary">Скасувати</a>

  </form>
{% endblock %}
