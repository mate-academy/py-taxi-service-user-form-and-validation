{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Create driver</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}

    <input type="submit" value="Submit" class="btn btn-primary">
  </form>
  <a style="margin-top: 20px" href="{{ previous_url }}" class="btn btn-primary">Cancel</a>
{% endblock %}
