
{% extends "base.html" %}

{% block content %}
  <h1>{{ object|yesno:"Update,Create" }} driver</h1>

  <form action="" method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <input
      type="submit"
      value="{{ object|yesno:'Update,Create' }}"
      class="btn btn-primary"
    >

    <a href="{% url 'taxi:driver-list' %}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
