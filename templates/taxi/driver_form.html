{% extends "base.html" %}
{% load crispy_forms_filters %}
{% block content %}
  <h1>
    Create Driver
  </h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <div class="d-flex gap-2">
      <!-- Кнопка підтвердження (POST запит) -->
      <button type="submit" class="btn btn-success flex-grow-1">Submit</button>
      <!-- Кнопка відміни (Звичайне GET посилання на список) -->
      <a href="{% url 'taxi:driver-list' %}" class="btn btn-outline-secondary flex-grow-1">
          Cancel
      </a>
    </div>
  </form>
{% endblock %}
