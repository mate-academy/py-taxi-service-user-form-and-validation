{% extends "base.html" %}

{% block content %}
  <h1>{% if form.instance.pk %}Update{% else %}Create{% endif %} Driver</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'taxi:driver-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
