{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Update License Number</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Update</button>
    <a href="{% url 'taxi:driver-detail' object.pk %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
