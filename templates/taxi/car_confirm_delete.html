{% extends "base.html" %}

{% block content %}
  <h1>Delete car</h1>

  <p>
    Are you sure you want to delete
    <strong>{{ car.manufacturer.name }} {{ car.model }}</strong>?
  </p>

  <form method="post" action="">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
      Yes, delete
    </button>

    <a href="{% url 'taxi:car-detail' pk=car.pk %}"
       class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
