{% extends "base.html" %}

{% block content %}
	<h1>Delete car?</h1>
	<form action="" method="post">
		{% csrf_token %}
		<p>Are you sure you want to remove the driver: {{ driver.username }}?</p>

		<input type="submit" value="Yes" class="btn btn-danger">

		<button type="button" class="btn btn-secondary" onclick="window.history.back()">
			Cancel
		</button>
	</form>
{% endblock %}
