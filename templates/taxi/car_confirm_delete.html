{% extends "base.html" %}

{% block content %}
  <h1>Delete car?</h1>
  <p>Are you sure you want to delete {{ car.model }}?</p>
  <form action="" method="post">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">Delete car</button>
    <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
