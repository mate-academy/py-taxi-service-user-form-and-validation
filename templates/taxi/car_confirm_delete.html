{% extends "base.html" %}

{% block content %}
  <h1>Delete car?</h1>

  <p>Are you sure you want to delete car "{{ car.model }}"?</p>

  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Yes" class="btn btn-danger">
    <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
