{% extends "base.html" %}

{% block content %}
  <h1>Delete car?</h1>
  <form action="" method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete car: <strong>{{ car }}</strong>?</p>

    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="{{ car.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
