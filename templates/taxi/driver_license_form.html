<!-- html -->
{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Update driver license</h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ object.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
