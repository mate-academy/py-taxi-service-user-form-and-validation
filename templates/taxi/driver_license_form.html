{% extends "base.html" %}

{% block content %}
  <h1>Update license for {{ driver.username }}</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <a href="{% url 'taxi:driver-detail' pk=driver.id %}" class="btn btn-secondary">
      Cancel
    </a>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
  {% endblock %}
