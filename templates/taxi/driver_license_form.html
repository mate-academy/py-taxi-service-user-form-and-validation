{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>Update license for {{ object.username }}</h1>
  <p>Use 3 uppercase English letters followed by 5 digits, such as ABC12345.</p>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save license</button>
    <a href="{{ object.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
