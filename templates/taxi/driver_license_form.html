{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>Update driver's license</h1>

  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'taxi:driver-detail' pk=object.pk %}"
       class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
