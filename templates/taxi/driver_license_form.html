{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Update license for {{ driver.username }}</h1>
  <p>Use 3 uppercase letters followed by 5 digits, for example ABC12345.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save license</button>
    <a
      href="{% url 'taxi:driver-detail' pk=driver.pk %}"
      class="btn btn-secondary"
    >
      Cancel
    </a>
  </form>
{% endblock %}
