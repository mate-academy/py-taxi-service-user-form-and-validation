{% extends "base.html" %}

{% block content %}
  <h1>Delete manufacture?</h1>
  <form action="" method="post" class="button-form">
    {% csrf_token %}
    <input type="submit" value="Yes" class="btn btn-danger">
    <a href="{% url 'taxi:manufacturer-list' %}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}

{% block extra_css %}
<style>
  .button-form {
    display: flex;
    gap: 10px;
  }
</style>
{% endblock %}
