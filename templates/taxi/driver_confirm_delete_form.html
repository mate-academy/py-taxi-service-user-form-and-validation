{% extends "base.html" %}
{% block content %}
  <h1>Delete Driver</h1>

  <p> Are you sure you want to delete the Driver: {{ driver.first_name }} {{ driver.last_name }}</p>

  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger"/>
  </form>
  <br>
  <button type="button" class="btn btn-primary" onclick="window.history.back()">No, cancel!</button>

{% endblock %}
