{% extends "base.html" %}

{% block content %}
  <h1>Delete Driver?</h1>
  <div class="d-flex flex-row bd-highlight mb-3">
    <div class="p-2 bd-highlight">
      <form action="" method="post">
        {% csrf_token %}

        <input type="submit" value="Yes" class="btn btn-danger">
      </form>
    </div>
    <div class="p-2 bd-highlight">
      <a class="btn btn-primary" href="{% url 'taxi:driver-detail' driver.id %}">Cancel</a>
    </div>
  </div>
{% endblock %}
