{% extends "base.html" %}

{% block content %}
  <h1>Are you sure you want to delete {{ driver.name }}?</h1>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm Delete</button>
  </form>
  <a href="{% url 'taxi:driver-detail' driver.pk %}" class="btn btn-secondary">Cancel</a>
{% endblock %}
