{% extends "base.html" %}

{% block content %}
  <h1>Delete driver?</h1>
  <p>Are you sure you want to delete driver "{{ driver.username }}"?</p>
  <form action="" method="post">
    {% csrf_token %}
    <a href="{% url 'taxi:driver-detail' pk=driver.id %}" class="btn btn-secondary">
      Cancel
    </a>
    <input type="submit" value="Yes" class="btn btn-danger">
  </form>
{% endblock %}
