{% extends "base.html" %}

{% block content %}
  <h1>Delete driver?</h1>
  <p>Are you sure you want to delete {{ driver.username }}?</p>

  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Yes" class="btn btn-danger">
    <a href="{{ request.META.HTTP_REFERER|default:driver.get_absolute_url }}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
