{% extends "base.html" %}

{% block content %}
  <h1>Delete driver?</h1>
  <p>You sure you want to delete this driver?</p>
  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Yes" class="btn btn-danger">
    <a href="{{ request.META.HTTP_REFERER|default:'/drivers/' }}" class="btn btn-primary">Cancel</a>
  </form>
{% endblock %}
