{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
    <h1>Delete driver: {{ driver.username }}?</h1>
    <p>Are you sure you want to remove the driver "{{ driver.username }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url "taxi:driver-detail" pk=driver.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock content %}
