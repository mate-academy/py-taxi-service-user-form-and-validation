{% extends "base.html" %}

{% block content %}
  <h1>Delete driver?</h1>
  <p>Are you sure you want to delete the driver: {{ driver.username }}?</p>
  <p><i>This action cannot be undone.</i></p>

  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="{{ driver.get_absolute_url }}"
       class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
