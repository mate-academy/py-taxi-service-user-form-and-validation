{% extends "base.html" %}

{% block content %}
  <h1>Delete Driver?</h1>
  <p>{{ driver.username }} - ({{ driver.first_name }} {{ driver.last_name }})</p>
  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Yes" class="btn btn-danger">
    <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
