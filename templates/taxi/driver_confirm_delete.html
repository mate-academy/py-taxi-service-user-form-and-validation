

{% extends "base.html" %}

{% block content %}
  <h1>Delete driver {{ object.username }}</h1>
  <form method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete this driver?</p>
    <button type="submit" class="btn btn-danger">Confirm</button>
    {% url 'taxi:driver-detail' object.pk as fallback_url %}
    <a href="{{ request.META.HTTP_REFERER|default:fallback_url }}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
