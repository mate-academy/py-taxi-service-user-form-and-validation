{% extends "base.html" %}

{% block content %}
  <h2>Delete driver {{ object }}</h2>
  <form method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete this driver?</p>
    <button type="submit" class="btn btn-danger">Confirm Delete</button>
    <a href="{% url 'taxi:driver-detail' pk=object.pk %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
