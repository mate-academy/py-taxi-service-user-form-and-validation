{% extends "base.html" %}

{% block content %}
  <h1>Delete driver "{{ object.username }}"?</h1>
  <form action="" method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a
      href="{% if request.META.HTTP_REFERER %}{{ request.META.HTTP_REFERER }}{% else %}{% url 'taxi:driver-list' %}{% endif %}"
      class="btn btn-secondary"
    >
      Cancel
    </a>
  </form>
{% endblock %}
