{% extends "base.html" %}

{% block content %}
  <h1>Delete driver</h1>

  <p>
    Are you sure you want to delete {{ driver.username }}?
  </p>

  <form method="post">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
      Yes, delete
    </button>
    <a href="{{ request.META.HTTP_REFERER|default:'/' }}"
       class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
