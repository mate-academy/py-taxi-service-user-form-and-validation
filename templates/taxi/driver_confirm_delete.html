{% extends "base.html" %}

{% block content %}
  <h1>Delete driver?</h1>
  <p>Are you sure you want to delete {{ driver.username }}?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete driver</button>
    <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
