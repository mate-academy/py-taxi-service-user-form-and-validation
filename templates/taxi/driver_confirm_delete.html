{% extends "base.html" %}

{% block content %}
  <h1>Delete Driver</h1>
  <p>Are you sure want to delete the driver "{{ object }}"?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'taxi:driver-detail' pk=object.id %}">Cancel</a>
  </form>
{% endblock %}
