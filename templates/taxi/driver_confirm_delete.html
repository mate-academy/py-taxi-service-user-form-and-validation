{% extends "base.html" %}

{% block content %}
  <h1>Delete driver: {{ driver.first_name }} {{ driver.last_name }}?</h1>
  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Yes" class="btn btn-danger">
    <a class="btn btn-secondary" href="{% url 'taxi:driver-detail' pk=driver.pk %}">No</a>
  </form>
{% endblock %}
