{% extends "base.html" %}
{% block content %}
  <h1>Delete Driver</h1>
  <p>Are you sure you want to delete driver {{ driver }}?</p>
  <p><i>This driver will be deleted!</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a class="btn btn-primary" type="submit" href="{% url 'taxi:driver-detail' pk=driver.pk %}">Cancel</a>
  </form>
{% endblock %}
