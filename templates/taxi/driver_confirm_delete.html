{% extends "base.html" %}

{% block content %}
  <h1>Delete Driver?</h1>
  <form action="" method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete driver: <strong>{{ driver }}</strong>?</p>

    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="{{ driver.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
