{% extends "base.html" %}

{% block content %}
  <h1>Delete driver {{ driver.username }}?</h1>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes" class="btn btn-danger">
    <a href="{{ request.GET.next|default:driver.get_absolute_url }}"
       class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
