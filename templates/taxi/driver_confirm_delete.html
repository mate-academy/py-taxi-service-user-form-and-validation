{% extends "base.html" %}

{% block content %}
  <h1>Delete Driver</h1>

  <p>Are you sure you want to delete driver: <strong>{{ object.username }}</strong>?</p>

  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
