{% extends 'base.html' %}
{% load crispy_forms_filters %}

{% block content %}
	<p>Are you sure you want to delete driver: {{ driver.username }}</p>
  <p><i>All data related to this driver will be deleted</i></p>
  <form action="" method="POST">
    {% csrf_token %}
    {{ form|crispy }}
    <input class="btn btn-danger" type="submit" value="Delete">
  </form>
  <br>
  <a class="btn btn-primary" href="{{ request.GET.next }}">Cancel</a>
{% endblock %}
