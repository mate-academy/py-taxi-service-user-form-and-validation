{% extends "base.html" %}

{% block content %}
  <h2>Delete Driver</h2>
  
  <p>Are you sure you want to delete the driver: <strong>{{ object.username }}</strong>?</p>

  <form action="" method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm Delete</button>
    <a href="{% url 'taxi:driver-detail' object.id %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
