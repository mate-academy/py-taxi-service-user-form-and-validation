{% extends "base.html" %}

{% block content %}
  <h1>Delete driver?</h1>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes" class="btn btn-danger">
    <a class="btn btn-secondary" href="
      {% if request.META.HTTP_REFERER %}{{ request.META.HTTP_REFERER }}{% else %}{% url 'taxi:driver-list' %}{% endif %}">Cancel</a>
  </form>
{% endblock %}
