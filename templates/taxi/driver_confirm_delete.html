{% extends "base.html" %}

{% block content %}
  <h1>Delete driver {{ driver.username }}?</h1>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm delete</button>
    <a href="{% url 'taxi:driver-detail' pk=driver.pk %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
