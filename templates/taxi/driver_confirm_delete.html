{% extends "base.html" %}

{% block content %}
  <h1>Delete Driver</h1>

  <p>Are you sure you want to delete the driver: <strong>{{ driver.username }}</strong>?</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes" class="btn btn-danger">
  </form>
    <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-primary">Cancel</a>
{% endblock %}
