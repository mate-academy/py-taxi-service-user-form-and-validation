{% extends "base.html" %}

{% block content %}
  <h1>Delete car?</h1>
  <p>Are you sure you want to delete this driver: {{ driver }}?</p>
  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Yes" class="btn btn-danger">
  </form>
  <a href="{% url 'taxi:driver-detail' driver.id %}" class="btn btn-primary mt-3">No, I changed my mind</a>
{% endblock %}
