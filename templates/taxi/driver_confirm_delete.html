{% extends "base.html" %}

{% block content %}
  <h1>Delete Driver</h1>

  <p>Are you sure want to delete the Driver: {{ driver }}</p>
  <p><i>All information with this driver will be also deleted!</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger" />
    <input type="submit" value="Cancel" class="btn btn-secondary" />
  </form>
  <form action="" method="post">
    {% csrf_token %}
    <a href="driver_list.html" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
