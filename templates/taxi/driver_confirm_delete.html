{% extends "base.html" %}

{% block content %}
  <h1>Delete Driver</h1>
  <p>Are you sure that you want to delete <strong>{{ driver.first_name }} {{ driver.last_name }}</strong>?</p>
  <form action="" method="post">
    {% csrf_token %}
    {{ form }}
    <input type="submit" value="Delete" class="btn btn-danger">
    <a href="{% url "taxi:driver-detail" pk=driver.id %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
