{% extends "base.html" %}

{% block content %}
  <h1>Delete driver</h1>

  <p>Are you sure you want to delete driver "{{ driver.username }}" ({{ driver.first_name }} {{ driver.last_name }})?</p>

  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Yes" class="btn btn-danger">
    <a href="{% url 'taxi:driver-detail' pk=driver.id %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
