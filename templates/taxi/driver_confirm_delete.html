{% extends "base.html" %}
{% block content %}
  <h1>Delete Driver</h1>
  <p>Are you sure you want to delete Driver: {{ driver }}</p>
  <form action="" method="post">
    {% csrf_token %}
    <input
        type="submit"
        value="Yes, delete"
        class="btn btn-danger"/>
    <button
        type="button"
        onclick="window.history.back()"
        class="btn btn-secondary">
      Cancel
    </button>
  </form>
{% endblock %}
