{% extends "base.html" %}

{% block content %}
  <h1>Delete driver {{ driver.username }}?</h1>
  <form method="post">
    {% csrf_token %}
    <input type="submit" class="btn btn-danger" value="Yes, delete">
    <a href="{% url 'taxi:driver-detail' pk=driver.id %}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
