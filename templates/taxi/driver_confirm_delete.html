{% extends "base.html" %}

{% block content %}
  <h1>Delete driver?</h1>
  <form action="" method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete {{ driver.first_name }} {{ driver.last_name }}</p>
    <input type="submit" value="Yes" class="btn btn-danger">
  </form>
  
  <input type="button" value="Cancel" onclick="history.back()">
{% endblock %}
