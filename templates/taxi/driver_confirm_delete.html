{% extends "base.html" %}
{% block content %}
  <h1>Delete Driver</h1>

  <p>Are you sure you want to delete Driver: {{ driver.username }}</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn badge-danger">
    <a href="{% url "taxi:driver-detail" pk=driver.id %}" class="btn btn-primary">Cancel</a>
  </form>
{% endblock %}
