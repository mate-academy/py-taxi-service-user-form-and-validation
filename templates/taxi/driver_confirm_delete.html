{% extends "base.html" %}

{% block content %}
  <h1>Delete driver</h1>
  <p>Are you sure you want to delete "{{ object }}"?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm delete</button>
    <a href="{% url 'taxi:driver-detail' pk=object.pk %}"
       class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
