{% extends "base.html" %}
{% block content %}
  <h1> Delete Driver</h1>

  <p> Are you want to delete the driver: {{ driver }}?</p>
  <p><i>This driver will be also deleted!</i></p>
  
  <form action="" method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'taxi:driver-detail' pk=driver.id %}" class="btn btn-secondary">Cancel</a>
  </form>

{% endblock %}
