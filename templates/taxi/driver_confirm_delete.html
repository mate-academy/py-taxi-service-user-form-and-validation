{% extends "base.html" %}

{% block content %}
  <h1>Delete driver: {{ object }}</h1>
  <p>Are you sure you want to delete this driver?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm</button>
    <a href="{{ object.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
