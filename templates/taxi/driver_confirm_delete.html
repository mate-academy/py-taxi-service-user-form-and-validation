{% extends "base.html" %}
{% block content %}
  <h1>Delete Driver</h1>

  <p>Are you want to delete the Driver: {{ driver }}?</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger"/>

    {% if request.META.HTTP_REFERER %}
      <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-secondary">Cancel</a>
    {% else %}
      <a href="{% url 'taxi:driver-list' %}" class="btn btn-secondary">Cancel</a>
    {% endif %}
  </form>
{% endblock %}
