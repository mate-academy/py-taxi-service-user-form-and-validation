{% extends "base.html" %}

{% block content %}
  <h1>Delete driver?</h1>

  <p><i>Are you sure, you want to delete: {{ driver.username }}</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input class="btn btn-danger" type="submit" value="Yes, delete">
    <a class="btn btn-secondary" href="{% url 'taxi:driver-detail' pk=driver.id %}">Cancel</a>
  </form>
{% endblock %}
