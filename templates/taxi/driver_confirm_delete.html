{% extends "base.html" %}

{% block content %}
  <h1>Delete driver</h1>
  <p>Are you sure you want to delete {{ object.username }}?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm</button>
    <button
      type="button"
      class="btn btn-secondary"
      onclick="window.history.back();"
    >
      Cancel
    </button>
  </form>
{% endblock %}
