{% extends "base.html" %}

{% block content %}
  <h1>Delete driver?</h1>
  <p><i>Are you sure you want to delete the {{ driver.first_name }} {{ driver.last_name }} driver?</i></p>
  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Yes" class="btn btn-danger">
    <a class="btn btn-primary" href="{% url 'taxi:driver-detail' pk=driver.id %}">Cancel</a>
  </form>
{% endblock %}
