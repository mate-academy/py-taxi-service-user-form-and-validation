{% extends "base.html" %}

{% block content %}
  <h1>Delete driver</h1>
  <p>Are you sure you want to delete {{ object.username }}?</p>
  <form method="post">
    {% csrf_token %}
    <input type="submit" class="btn btn-danger" value="Yes, delete">
    <a href="{% url 'taxi:driver-detail' pk=object.pk %}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
