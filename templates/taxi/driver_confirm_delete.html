{% extends "base.html" %}

{% block content %}
  <h1>Delete driver {{ object.username }}?</h1>
  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Delete" class="btn btn-danger">
    {% url 'taxi:driver-list' as fallback_url %}
    <a href="{{ request.META.HTTP_REFERER|default:fallback_url }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
