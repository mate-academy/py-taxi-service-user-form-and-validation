{% extends "base.html" %}

{% block content %}
  <h2>Delete Driver</h2>
    <p>Are you sure you want to delete {{ driver.username }}?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
       <a href="{% url 'taxi:driver-detail' driver.pk %}"
          class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
