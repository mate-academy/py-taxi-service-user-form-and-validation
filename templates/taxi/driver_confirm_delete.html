{% extends "base.html" %}

{% block content %}
  <div class="mt-4 col-md-6">

    <h1 class="mb-4">Delete driver?</h1>

    <div class="alert alert-warning">
      Are you sure you want to delete driver <strong>{{ driver.username }}</strong>?
    </div>

    <form method="post">
      {% csrf_token %}

      <button type="submit" class="btn btn-danger">
        Yes, delete
      </button>

      <a href="javascript:history.back()" class="btn btn-secondary ml-2">
        Cancel
      </a>
    </form>

  </div>
{% endblock %}
