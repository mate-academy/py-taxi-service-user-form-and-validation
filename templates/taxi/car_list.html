{% extends "base.html" %}

{% block content %}
  <h1>Car list</h1>

  <a href="{% url 'taxi:car-create' %}" class="btn btn-primary">Create New
    Car</a>

  {% if cars %}
    <table class="table">
      <thead>
      <tr>
        <th>ID</th>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
      </thead>
      <tbody>
      {% for car in cars %}
        <tr>
          <td><a href="{% url 'taxi:car-detail' pk=car.id %}">{{ car.id }}</a>
          </td>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>

  {% else %}
    <p>There are no cars in the service.</p>
  {% endif %}
{% endblock %}
