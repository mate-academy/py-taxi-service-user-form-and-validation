{% extends "base.html" %}

{% block content %}
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="text-primary">🚗 Car List</h2>
      <a href="{% url 'taxi:car-create' %}" class="btn btn-success">+ Create Car</a>
    </div>

    {% if car_list %}
      <div class="row row-cols-1 row-cols-md-2 g-4">
        {% for car in car_list %}
          <div class="col">
            <div class="card shadow-sm h-100">
              <div class="card-body">
                <h5 class="card-title">
                  <a href="{% url 'taxi:car-detail' pk=car.id %}" class="text-decoration-none">
                    {{ car.model }}
                  </a>
                </h5>
                <p class="card-text">
                  Manufacturer: <strong>{{ car.manufacturer.name }}</strong><br>
                  Car ID: <code>{{ car.id }}</code>
                </p>
              </div>
            </div>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <div class="alert alert-warning">There are no cars in the taxi service.</div>
    {% endif %}
  </div>
{% endblock %}
