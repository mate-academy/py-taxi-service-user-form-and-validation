{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Update License Number</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <input class="btn btn-danger" type="submit" value="Submit">
    <a href="{% url 'taxi:driver-detail' pk=driver.id %}" class="btn btn-dark">Cancel</a>
  </form>
{% endblock %}
