{% extends "base.html" %}
{% load crispy_forms_filters %}
{% load crispy_forms_tags %}

{% block content %}
    <h1>Renew your driver's license for {{ driver.username }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
    </form>
    <a href="{% url "taxi:driver-detail" pk=driver.pk %}" class="btn btn-secondary mt-3">Cancel</a>
{% endblock content %}
