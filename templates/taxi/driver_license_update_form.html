

{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>Update license for {{ object.username }}</h1>
  <form method="post">
    {% csrf_token %}
    {% crispy form %}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'taxi:driver-detail' object.pk %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
