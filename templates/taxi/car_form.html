{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div class="card mt-4">
    <div class="card-header">
      <h1 class="card-title mb-0">{{ object|yesno:"Update,Create" }} car</h1>
    </div>
    <div class="card-body">
      <form action="" method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}

        <input type="submit" value="Submit" class="btn btn-primary">
      </form>
    </div>
  </div>
{% endblock %}
