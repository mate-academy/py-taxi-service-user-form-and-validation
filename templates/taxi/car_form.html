{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div class="mt-4 col-md-6">

    <h1 class="mb-4">
      {{ object|yesno:"Update,Create" }} car
    </h1>

    <form action="" method="post" novalidate>
      {% csrf_token %}
      {{ form|crispy }}

      <button type="submit" class="btn btn-primary">
        Submit
      </button>
    </form>

  </div>
{% endblock %}
