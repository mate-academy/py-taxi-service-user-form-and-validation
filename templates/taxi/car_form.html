{% extends "base.html" %}

{% block content %}
<h1>Update car</h1>
<form method="post">
    {% csrf_token %}

    <div class="form-group">
        {{ form.model.label_tag }}
        {{ form.model }}
    </div>

    <div class="form-group">
        {{ form.manufacturer.label_tag }}
        {{ form.manufacturer }}
    </div>

    <div class="form-group">
        <label>Drivers:</label>
        <div class="form-check">
            {% for driver in form.drivers %}
                <div class="form-check">
                    {{ driver.tag }}
                    <label class="form-check-label" for="{{ driver.id_for_label }}">
                        {{ driver.choice_label }}
                    </label>
                </div>
            {% endfor %}
        </div>
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>
</form>
{% endblock %}
