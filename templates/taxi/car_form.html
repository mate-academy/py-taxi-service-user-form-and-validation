{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>{{ object|yesno:"Update,Create" }} car</h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save car</button>
    <a href="{% if object %}{% url 'taxi:car-detail' pk=object.pk %}{% else %}{% url 'taxi:car-list' %}{% endif %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
