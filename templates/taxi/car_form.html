{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>{{ car|yesno:"Update,Create" }} car</h1>
  <form action="" method="post">
    {% csrf_token %}
    {{ form|crispy }}

    <input type="submit" value="Submit" class="btn btn-primary">
    <a href="{% url 'taxi:car-detail' car.id %}" class="btn btn-primary">Cancel</a>
  </form>
{% endblock %}
