{% extends "base.html" %}

{% block content %}
  <h1>{{ object|yesno:"Update,Create" }} car</h1>

  <form method="post" action="" novalidate>
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
      {% if object %}
        Save changes
      {% else %}
        Create car
      {% endif %}
    </button>

    {% if object %}
      <a href="{% url 'taxi:car-detail' pk=object.pk %}"
         class="btn btn-secondary">
        Cancel
      </a>
    {% else %}
      <a href="{% url 'taxi:car-list' %}"
         class="btn btn-secondary">
        Cancel
      </a>
    {% endif %}
  </form>
{% endblock %}
