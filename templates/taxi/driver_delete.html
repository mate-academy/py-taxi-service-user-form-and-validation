{% extends "base.html" %}
{% load crispy_forms_filters %}
{% block content %}
  <h2>Confirm Deletion</h2>
  <p>Are you sure you want to delete driver: {{ object }}?</p>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'taxi:driver-detail' object.pk %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
