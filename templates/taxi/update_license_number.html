{% extends "base.html" %}

{% block content %}
  <h1>Update License Number</h1>
  
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Update License</button>
    <a href="{% url 'taxi:driver-detail' object.pk %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
