{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div class="mt-4 col-md-6">

    <h1 class="mb-4">Change your password</h1>

    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}

      <button type="submit" class="btn btn-primary">
        Change password
      </button>
    </form>

  </div>
{% endblock %}
