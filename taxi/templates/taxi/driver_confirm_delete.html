{% extends "base.html" %}

{% block content %}
  <h1>Delete driver</h1>
  <p>Are you sure you want to delete <strong>{{ driver }}</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a class="btn btn-secondary" href="{{ driver.get_absolute_url }}">Cancel</a>
  </form>
{% endblock %}
